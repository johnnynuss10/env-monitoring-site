<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Select Node | John Temps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 2rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 2.5rem;
      color: #00d9ff;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 3rem;
      font-size: 1.1rem;
    }

    .back-link {
      text-align: center;
      margin-bottom: 2rem;
    }

    .back-link a {
      color: #00d9ff;
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-link a:hover {
      color: #00ff88;
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .node-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      text-decoration: none;
      color: #fff;
      display: block;
    }

    .node-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 217, 255, 0.5);
      background: rgba(0, 217, 255, 0.1);
    }

    .node-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .node-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #00d9ff;
      margin-bottom: 0.5rem;
    }

    .node-stats {
      color: #888;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #888;
      font-size: 1.2rem;
    }

    .error {
      text-align: center;
      padding: 3rem;
      color: #ff6b6b;
      font-size: 1.2rem;
    }

    .all-nodes-card {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(0, 255, 136, 0.2));
      border-color: rgba(0, 217, 255, 0.3);
    }

    .all-nodes-card:hover {
      border-color: rgba(0, 217, 255, 0.7);
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.3), rgba(0, 255, 136, 0.3));
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Select Node</h1>
    <p class="subtitle">Choose a sensor node to view its temperature logs</p>
    <p class="back-link"><a href="index.html">&larr; Back to Home</a></p>

    <div id="nodes-container">
      <p class="loading">Loading available nodes...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
