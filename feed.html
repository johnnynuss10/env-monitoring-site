<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Live Data | John Temps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      color: #00d9ff;
    }

    .current-reading {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    .current-reading h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #aaa;
      margin-bottom: 0.5rem;
    }

    .current-value {
      font-size: 4rem;
      font-weight: bold;
      color: #00d9ff;
    }

    .current-time {
      color: #888;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .device-form {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .device-form input {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1rem;
    }

    .device-form input::placeholder {
      color: #888;
    }

    .device-form button {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: #00d9ff;
      color: #16213e;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .device-form button:hover {
      background: #00ff88;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #888;
    }

    .error {
      text-align: center;
      padding: 2rem;
      color: #ff6b6b;
    }

    .refresh-info {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="page-title">John Temps - Live Data</h1>
    <p style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" style="color: #00d9ff; text-decoration: none;">&larr; Home</a>
      <span style="margin: 0 1rem; color: #666;">|</span>
      <a href="select-node.html" style="color: #00d9ff; text-decoration: none;">Change Node</a>
    </p>

    <div class="current-reading">
      <h2>Current Temperature</h2>
      <div id="current-value" class="current-value">--</div>
      <div id="current-time" class="current-time"></div>
      <div class="device-form">
        <input type="text" id="deviceIdFromForm" placeholder="Enter device ID" />
        <button type="button" id="submitButton">Get Reading</button>
      </div>
    </div>

    <p class="refresh-info">Auto-refreshes every 30 seconds</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
